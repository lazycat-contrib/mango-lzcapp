name: Mango
package: community.lazycat.app.mango
version: 0.0.6
min_os_version: 1.3.8
description: 一个自托管的漫画服务器和网络阅读器
homepage: https://github.com/vrsandeep/mango-go
author: vrsandeep
application:
  subdomain: mango
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://mango:8080/

services:
  mango:
    container_name: mango
    #  ghcr.io/vrsandeep/mango-go:dev
    image: registry.lazycat.cloud/czyt/vrsandeep/mango-go:0d0ba7aa5cc862b8
    environment:
      - GIN_MODE=release
      - MANGO_DATABASE_PATH=/app/data/mango.db
      - MANGO_LIBRARY_PATH=/manga
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/manga:/manga

locales:
  zh:
    name: "Mango"
    description: "一个自托管的漫画服务器和网络阅读器"
  zh_CN:
    name: "Mango"
    description: "一个自托管的漫画服务器和网络阅读器"
  en:
    name: "Mango"
    description: "a self-hosted manga server and web reader"
